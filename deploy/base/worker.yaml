apiVersion: apps/v1
kind: Deployment
metadata:
  name: atrium-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atrium-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: atrium-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: atrium-worker
          image: atrium-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8082
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: atrium-config
                  key: HOST
            - name: HEALTH_PORT
              value: "8082"
            - name: VENDOR_MODE
              valueFrom:
                configMapKeyRef:
                  name: atrium-config
                  key: VENDOR_MODE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atrium-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: atrium-secrets
                  key: REDIS_URL
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
