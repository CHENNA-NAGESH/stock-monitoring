apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atrium
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - atrium.example.com
      secretName: atrium-tls
  rules:
    - host: atrium.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atrium-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atrium-web
                port:
                  number: 80
