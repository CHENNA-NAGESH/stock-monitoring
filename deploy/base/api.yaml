apiVersion: apps/v1
kind: Deployment
metadata:
  name: atrium-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atrium-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: atrium-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: atrium-api
          image: atrium-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: atrium-config
                  key: HOST
            - name: PORT
              value: "8081"
            - name: STALE_AFTER_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: atrium-config
                  key: STALE_AFTER_SECONDS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atrium-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: atrium-secrets
                  key: REDIS_URL
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atrium-api
spec:
  selector:
    app: atrium-api
  ports:
    - name: http
      port: 80
      targetPort: http
