apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atrium-prod
resources:
  - ../../base
images:
  - name: atrium-web
    newName: REPLACE_REGISTRY/atrium-web
    newTag: REPLACE_TAG
