apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atrium
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atrium-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atrium-web
                port:
                  number: 80
