apiVersion: apps/v1
kind: Deployment
metadata:
  name: atrium-web
  labels:
    app: atrium-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atrium-web
  template:
    metadata:
      labels:
        app: atrium-web
    spec:
      containers:
        - name: atrium-web
          image: atrium-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atrium-web
spec:
  selector:
    app: atrium-web
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atrium-api
  labels:
    app: atrium-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atrium-api
  template:
    metadata:
      labels:
        app: atrium-api
    spec:
      containers:
        - name: atrium-api
          image: atrium-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8081"
            - name: STALE_AFTER_SECONDS
              value: "30"
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atrium-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: atrium-secrets
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atrium-api
spec:
  selector:
    app: atrium-api
  ports:
    - name: http
      port: 80
      targetPort: 8081
---
apiVersion: apps/v1
